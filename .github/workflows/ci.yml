name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  kubernetes:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: { cluster_name: vehicle-gateway }
      # Builds the image, loads it into kind, deploys with kustomize (restricted pod security),
      # then checks health, OAuth, MCP and the A2A card through the cluster.
      - run: ./scripts/k8s-local.sh
