apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vehicle-gateway
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
# Secrets are never committed: create secrets.env from secrets.env.example first.
secretGenerator:
  - name: gateway-secrets
    envs: [secrets.env]
generatorOptions:
  disableNameSuffixHash: false   # a changed secret rolls the Deployment automatically
